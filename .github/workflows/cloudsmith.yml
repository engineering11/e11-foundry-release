# Pushes each release's deb and rpm packages to the public Cloudsmith repo engineering11/foundry,
# which serves `apt install e11-foundry` and `dnf install e11-foundry`.
name: cloudsmith

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "release tag, e.g. v0.15.1", required: true }

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          verify-auth: "true"

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # --republish: a re-run for a tag Cloudsmith already has replaces it with the same bytes.
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.deb' -p '*.rpm'
          for f in *.deb; do cloudsmith push deb --republish engineering11/foundry/any-distro/any-version "$f"; done
          for f in *.rpm; do cloudsmith push rpm --republish engineering11/foundry/any-distro/any-version "$f"; done
